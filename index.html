<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Наш дом: опросник для двоих 🏠</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#4a2c3a}
body{background:linear-gradient(160deg,#fff1e6,#ffd9e2 55%,#e6dcff);background-attachment:fixed}
.fl{position:fixed;top:-40px;font-size:24px;opacity:.5;animation:fa linear infinite;pointer-events:none}
@keyframes fa{to{transform:translateY(110vh) rotate(360deg)}}
#v{max-width:480px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px 40px;display:flex;flex-direction:column;gap:14px;min-height:100vh;justify-content:center;position:relative;z-index:1;animation:in .45s}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
h1{font-size:clamp(28px,8vw,38px);line-height:1.15}h2{font-size:clamp(21px,5.6vw,27px);line-height:1.25}
p{line-height:1.5}.c{text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.chip{background:#fff;border-radius:20px;padding:6px 12px;color:#d6406a}
.bar{height:8px;border-radius:4px;background:#fff8;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8aa5,#ffb36b);border-radius:4px;transition:.4s}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid transparent;background:#fff;color:#4a2c3a;font:inherit;font-size:16px;padding:14px;border-radius:16px;cursor:pointer;box-shadow:0 4px 14px rgba(180,80,110,.12);transition:.2s}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:#ffe3ea;color:#d6406a;display:grid;place-items:center;font-size:14px}
.opt.sel{border-color:#ff6b8b;background:#fff0f4;transform:scale(1.02)}.opt.sel b{background:#ff6b8b;color:#fff}
.btn{border:none;background:linear-gradient(135deg,#ff6b8b,#ff9a6b);color:#fff;font:inherit;font-size:17px;font-weight:700;padding:15px 28px;border-radius:16px;cursor:pointer;box-shadow:0 8px 22px rgba(255,100,120,.4)}
.btn.alt{background:#fff;color:#d6406a;box-shadow:none;border:2px solid #ffc2d0}
.back{background:none;border:none;color:#9a6b7c;font:inherit;font-size:15px;cursor:pointer;align-self:flex-start}
input,textarea{width:100%;padding:14px;border-radius:14px;border:2px solid #ffc2d0;font:inherit;font-size:16px;color:#4a2c3a;background:#fff}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 20px rgba(180,80,110,.14);line-height:1.55}
.tr{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.tr div{height:10px;border-radius:5px;background:#ffe3ea;overflow:hidden}.tr i{display:block;height:100%;background:linear-gradient(90deg,#ff8aa5,#ffb36b)}
.ans{font-size:14px;max-height:260px;overflow:auto;white-space:pre-wrap}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1;padding:14px 10px;font-size:15px}
.big{font-size:54px;text-align:center}
.diff{font-size:14px;border-top:1px dashed #ffc2d0;padding-top:8px;margin-top:8px}
</style></head><body>
<div id="v"></div>
<script>
const Q=[
["Как ты относишься к уборке?",["Люблю чистоту, убираю сразу|O","Убираю, когда накопится и есть настроение|F","Главное уют, а не идеальный порядок|C","Лучше разделить зоны и делать каждому своё|D"]],
["Посуда после ужина — это…",["Мою сразу, не люблю гору в раковине|O","Могу оставить до утра, ничего страшного|F","Мою, если вижу, что партнёр устал|C","Один готовит, другой моет — так честно|D"]],
["Как у вас будет с готовкой?",["Готовим вместе, это наше время|C","Кто-то один, второй помогает|D","Каждый сам для себя, когда как|S","Люблю меню на неделю и список покупок|O"]],
["Как хранить вещи дома?",["Всё по местам, у каждой вещи свой дом|O","Творческий беспорядок, но я знаю где что|F","Общее вместе, личное у каждого отдельно|S","Договоримся вместе, где что лежит|D"]],
["Стирка и бельё",["Стираю по расписанию|O","Когда корзина полная|F","Могу и за двоих, мне не сложно|C","Каждый стирает своё|S"]],
["Ты скорее сова или жаворонок?",["Жаворонок, люблю ранние утра|O","Сова, ночью я оживаю|F","Подстроюсь под ритм любимого человека|C","Пусть у каждого будет свой режим|S"]],
["Идеальные выходные дома…",["Плед, кино и вкусная еда вдвоём|C","Спонтанные поездки и приключения|F","Немного вместе, немного порознь|S","С планом: что, когда и во сколько|O"]],
["Тишина или звуки дома",["Люблю тишину|S","Фоном музыка или сериал|F","Хочу слушать и смотреть всё вместе|C","По настроению, договоримся|D"]],
["Гости дома",["Чем чаще, тем лучше|F","Предупреждать заранее обязательно|O","Лучше встречаться в кафе или у друзей|S","Хорошо, если гости приятны нам обоим|C"]],
["Личное пространство",["Мне нужно время побыть одному каждый день|S","Могу быть вместе почти всегда|C","Скажу прямо, когда нужна пауза|D","Главное, чтобы пауза не значила холод|F"]],
["Атмосфера в доме",["Тепло, плед и свечи|C","Свежо, чисто и проветрено|O","Мне всё равно, подстроюсь|F","Найдём середину вместе|D"]],
["Деньги на быт",["Общий бюджет на двоих|C","Делим расходы пополам|D","Каждый платит за своё, общее отдельно|S","Веду учёт и планирую траты|O"]],
["Спонтанные покупки для дома",["Обсуждаем, если дорого|D","Купил, если захотелось: жизнь одна|F","Только по списку|O","Люблю радовать близкого сюрпризами|C"]],
["Что важнее всего перед переездом?",["Договориться о правилах быта|D","Купить нужное и сделать уютно|C","Чтобы у каждого было своё место|S","Не придумывать лишнего, разберёмся по ходу|F"]],
["Как поделим обязанности?",["Составим список и разделим|O","Каждый делает то, что получается лучше|D","Помогаем друг другу по ситуации|C","Пусть будет как получится|F"]],
["Чего ты опасаешься в совместной жизни?",["Бытовых ссор из-за мелочей|D","Потери личного пространства|S","Скуки и рутины|F","Что один будет делать больше другого|O"]],
["Что радует больше всего?",["Засыпать и просыпаться вместе|C","Свой уютный дом|O","Новые приключения вдвоём|F","Надёжность и поддержка рядом|D"]],
["Вещи снова не на месте, уже в десятый раз. Что ты делаешь?",["Спокойно скажу, что меня это расстраивает|D","Молча уберу, но внутри накопится|C","Пошучу, чтобы разрядить обстановку|F","Предложу общее правило и сам начну его соблюдать|O"]],
["Поссорились из-за немытой посуды. Что дальше?",["Остынем и поговорим вечером|D","Помирюсь первым, ссора не стоит того|C","Мне нужно время одному, потом вернусь|S","Придумаем график, чтобы не повторялось|O"]],
["Один хочет тишины, другой хочет позвать гостей",["Найдём компромисс: гости раз в неделю|D","Уступлю, если для любимого это важно|C","Уйду в другую комнату на время|S","Предложу встретиться вне дома|F"]],
["Забыли оплатить счёт, и это вылилось в ссору",["Без обвинений: просто решаем проблему|D","Заведём напоминания и график|O","Беру вину на себя и исправляю|C","Посмеёмся, в следующий раз не забудем|F"]],
["Вечером один устал, другой хочет гулять",["Договоримся: сегодня дома, завтра гуляем|D","Пойду, если это радует партнёра|C","Каждый проведёт вечер как хочет|S","Придумаю что-то среднее: короткая прогулка|F"]],
["Как ты просишь о помощи по дому?",["Прямо говорю, что нужно|D","Составляю список дел|O","Намекаю и надеюсь, что поймут|C","Делаю сам, а если не выходит, прошу|S"]],
["Что поможет вам не ссориться на бытовой почве?",["Регулярные честные разговоры|D","Чёткие правила и график|O","Юмор и лёгкость|F","Забота и внимание друг к другу|C"]]];
const CAT=[[0,"Быт 🧺"],[5,"Привычки 🌙"],[11,"Деньги 💰"],[13,"Подготовка 📦"],[17,"Ситуации 🔥"]];
const T={O:["Хранитель порядка 🧹","Тебе важны порядок и ясность, рядом с тобой дому спокойно. Мягкий совет: оставляйте место для неидеального, иногда уют важнее чистоты."],
F:["Свободный дух 🌈","Ты лёгок на подъём и умеешь не зацикливаться на мелочах. Мягкий совет: о важном (бюджет, уборка, гости) лучше договориться заранее."],
C:["Заботливое сердце 💞","Ты показываешь любовь делом: ужин, тёплое слово, помощь. Мягкий совет: говори вслух, если устаёшь, и не копи в себе."],
S:["Хранитель личных границ 🌙","Тебе важно иметь свой уголок и время для себя, это здоровая потребность. Мягкий совет: объясни близкому, что пауза не значит холод."],
D:["Мастер диалога 🗣️","Ты умеешь говорить о том, что беспокоит, и искать решения вместе. Мягкий совет: выбирай спокойный момент и не откладывай разговор."]};
const N={O:"Порядок",F:"Гибкость",C:"Забота",S:"Своё пространство",D:"Диалог"};
let i=-1,A=[],name='';
const v=document.getElementById('v');
for(let k=0;k<10;k++){const e=document.createElement('div');e.className='fl';e.textContent=['🏠','🧺','🍳','🛋️','💞','🕯️'][k%6];e.style.cssText+=`left:${k*10+Math.random()*6}vw;animation-duration:${14+Math.random()*10}s;animation-delay:${-Math.random()*20}s`;document.body.append(e)}
function show(h){v.innerHTML=h;v.style.animation='none';v.offsetHeight;v.style.animation='';scrollTo(0,0)}
function intro(){show(`<div class="big">🏠💞</div><h1 class="c">Наш дом: опросник для двоих</h1><p class="c">24 вопроса про быт, привычки, деньги и ссоры. Отвечайте честно и отдельно друг от друга, а в конце вас ждёт мягкий разбор характера и сравнение ответов.</p><input id="nm" placeholder="Как тебя зовут?"><button class="btn" onclick="start()">Начать 💕</button>`)}
function start(){name=document.getElementById('nm').value.trim()||'Без имени';i=0;A=[];q()}
function q(){const[t,o]=Q[i],c=[...CAT].reverse().find(x=>i>=x[0])[1];
show(`<div class="top"><span class="chip">${c}</span><span>${i+1} / ${Q.length}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><h2>${t}</h2><div class="opts">${o.map((x,k)=>`<button class="opt${A[i]===k?' sel':''}" onclick="pick(${k},this)"><b>${k+1}</b><span>${x.split('|')[0]}</span></button>`).join('')}</div>${i?'<button class="back" onclick="i--;q()">← Назад</button>':''}`)}
function pick(k,b){A[i]=k;b.classList.add('sel');setTimeout(()=>{++i<Q.length?q():res()},260)}
function sc(a){const s={O:0,F:0,C:0,S:0,D:0};a.forEach((k,j)=>s[Q[j][1][k].split('|')[1]]++);return s}
function code(){return btoa(unescape(encodeURIComponent(JSON.stringify({n:name,a:A}))))}
function msg(){const s=sc(A),r=Object.entries(s).sort((a,b)=>b[1]-a[1]);
return `Опросник «Наш дом» 🏠\n${name}: ${T[r[0][0]][0]}\n\nМои ответы:\n`+Q.map((x,j)=>`${j+1}. ${x[1][A[j]].split('|')[0]}`).join('\n')+`\n\nКод для сравнения:\n${code()}`}
function res(){const s=sc(A),r=Object.entries(s).sort((a,b)=>b[1]-a[1]),m=Math.max(...Object.values(s));
show(`<div class="big">✨</div><h1 class="c">${name}, ты — ${T[r[0][0]][0]}</h1><div class="card"><p>${T[r[0][0]][1]}</p><p style="margin-top:10px">А ещё в тебе заметна черта «${N[r[1][0]]}»: ${T[r[1][0]][1].split('. ')[0].replace(/^Ты /,'ты ')}.</p></div><div class="card"><b>Твои черты в быту</b>${r.map(([k,n])=>`<div class="tr"><span>${N[k]}</span><div><i style="width:${n/m*100}%"></i></div><span>${n}</span></div>`).join('')}<p style="font-size:13px;margin-top:8px;opacity:.8">Это не диагноз, а лёгкая игра: нет «плохих» результатов, есть повод лучше узнать друг друга 💗</p></div><div class="card"><b>Твои ответы</b><div class="ans">${Q.map((x,j)=>`${j+1}. ${x[1][A[j]].split('|')[0]} (вариант ${A[j]+1})`).join('\n')}</div></div><div class="row"><button class="btn" onclick="cp()">📋 Скопировать</button><button class="btn alt" onclick="tg()">✈️ В Telegram</button></div><p class="c" id="ok" style="font-size:14px"></p><div class="card"><b>Сравнить с половинкой 💞</b><p style="font-size:14px;margin:6px 0 10px">Вставь код, который пришлёт партнёр (он в конце его сообщения).</p><textarea id="pc" rows="3" placeholder="Код партнёра"></textarea><button class="btn" style="margin-top:10px;width:100%" onclick="cmp()">Сравнить</button><div id="cr"></div></div>`)}
function cp(){navigator.clipboard.writeText(msg()).then(()=>ok.textContent='Скопировано! Отправь половинке 💕').catch(()=>ok.textContent='Сделай скриншот и отправь 💕')}
function tg(){open('https://t.me/share/url?url=%20&text='+encodeURIComponent(msg()))}
function cmp(){let p;try{p=JSON.parse(decodeURIComponent(escape(atob(pc.value.trim().split(/\s/).pop()))));if(p.a.length!=Q.length)throw 0}catch(e){cr.innerHTML='<p style="margin-top:10px">Не получилось прочитать код. Проверь, что скопирован весь код целиком 🙈</p>';return}
const same=A.filter((k,j)=>k===p.a[j]).length,pct=Math.round(same/Q.length*100),a1=Object.entries(sc(A)).sort((a,b)=>b[1]-a[1])[0][0],a2=Object.entries(sc(p.a)).sort((a,b)=>b[1]-a[1])[0][0];
const tier=pct>=65?'Вы очень близки в быту: многое решится само, а остальное легко обсудить 💞':pct>=40?'У вас много общего и приятных отличий: рядом друг с другом вы будете расти и учиться договариваться 🌱':'Вы очень разные, и это интересно: главное, говорить открыто и не считать различия угрозой 💗';
const pair=a1==a2?`Вас обоих ведёт одна сильная сторона: «${N[a1]}». Следите, чтобы она не стала слепым пятном.`:`У тебя ярче «${N[a1]}», у ${p.n} — «${N[a2]}». Такие стороны дополняют друг друга, как две половинки одного дома.`;
const df=Q.map((x,j)=>A[j]!==p.a[j]?`<div class="diff"><b>${j+1}. ${x[0]}</b><br>${name}: ${x[1][A[j]].split('|')[0]}<br>${p.n}: ${x[1][p.a[j]].split('|')[0]}</div>`:'').filter(Boolean);
cr.innerHTML=`<div style="margin-top:14px"><div class="big" style="font-size:40px">${pct}%</div><p class="c"><b>${same} из ${Q.length}</b> ответов совпали</p><p style="margin-top:8px">${tier}</p><p style="margin-top:8px">${pair}</p><p style="margin-top:12px"><b>Темы, которые приятно обсудить за чаем ☕</b></p>${df.slice(0,8).join('')||'<p>Совпали все ответы, редкий случай!</p>'}${df.length>8?`<p style="font-size:13px;margin-top:8px">…и ещё ${df.length-8} тем</p>`:''}</div>`}
intro();
</script></body></html>
